spring.application.name=server

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# NOTE for the team: Flyway is currently disabled and Hibernate's
# ddl-auto=update creates/updates tables (including auth_tokens and
# oauth_accounts). Pick one approach before the schema grows.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.flyway.enabled=false

jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

# Email (Resend). If RESEND_API_KEY is empty, links are printed to the console.
resend.api-key=${RESEND_API_KEY:}
resend.from=${RESEND_FROM:Nibbling <onboarding@resend.dev>}

# Where emailed links and OAuth redirects point (the Next.js app).
app.frontend-url=${FRONTEND_URL:http://localhost:3000}
# Comma-separated list of sites allowed to call this API from a browser.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# ---- GitHub sign-in ----
# Callback URL to register on GitHub: http://localhost:8080/login/oauth2/code/github
# "not-set" placeholders let the server start before the keys exist.
spring.security.oauth2.client.registration.github.client-id=${GITHUB_CLIENT_ID:not-set}
spring.security.oauth2.client.registration.github.client-secret=${GITHUB_CLIENT_SECRET:not-set}
spring.security.oauth2.client.registration.github.scope=read:user,user:email

# ---- Discord sign-in ----
# Redirect URL to register on Discord: http://localhost:8080/login/oauth2/code/discord
spring.security.oauth2.client.registration.discord.client-id=${DISCORD_CLIENT_ID:not-set}
spring.security.oauth2.client.registration.discord.client-secret=${DISCORD_CLIENT_SECRET:not-set}
spring.security.oauth2.client.registration.discord.client-name=Discord
spring.security.oauth2.client.registration.discord.client-authentication-method=client_secret_post
spring.security.oauth2.client.registration.discord.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.discord.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.registration.discord.scope=identify,email
spring.security.oauth2.client.provider.discord.authorization-uri=https://discord.com/oauth2/authorize
spring.security.oauth2.client.provider.discord.token-uri=https://discord.com/api/oauth2/token
spring.security.oauth2.client.provider.discord.user-info-uri=https://discord.com/api/users/@me
spring.security.oauth2.client.provider.discord.user-name-attribute=id

# Trust X-Forwarded-* headers from the hosting proxy (Render), so the rate
# limiter sees real client IPs and OAuth callback URLs use https.
server.forward-headers-strategy=framework

# Don't leak stack traces or internal exception messages into API responses.
spring.web.error.include-message=never
spring.web.error.include-stacktrace=never
spring.web.error.include-binding-errors=never
